<!DOCTYPE html>
<html>
<head>
  <title>ClassClassroom</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
    }

    header {
      background: #2d6cdf;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      color: #2d6cdf;
    }

    input {
      padding: 8px;
      width: 70%;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 10px;
    }

    button {
      padding: 8px 10px;
      border: none;
      background: #2d6cdf;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 5px;
    }

    button:hover {
      background: #1b4fa8;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin: 6px 0;
    }

    .removeBtn {
      background: #ff4d4d;
    }

    .removeBtn:hover {
      background: #cc0000;
    }
  </style>
</head>

<body>

<header>ClassClassroom</header>

<div class="container">

  <div class="card">
    <h2>Announcements</h2>
    <p>Welcome to your classroom website.</p>
  </div>

  <div class="card">
    <h2>Assignments</h2>

    <ul id="taskList">
      <li>Math homework <button class="removeBtn" onclick="removeTask(this)">Remove</button></li>
      <li>Reading task <button class="removeBtn" onclick="removeTask(this)">Remove</button></li>
    </ul>

    <input id="taskInput" placeholder="Enter new assignment">
    <button onclick="addTask()">Add</button>
  </div>

  <div class="card">
    <h2>Resources</h2>
    <ul>
      <li>Notes</li>
      <li>Videos</li>
    </ul>
  </div>

</div>

<script>
function addTask() {
  const input = document.getElementById("taskInput");
  const list = document.getElementById("taskList");

  if (input.value.trim() === "") return;

  const item = document.createElement("li");
  item.innerHTML = input.value + ' <button class="removeBtn" onclick="removeTask(this)">Remove</button>';

  list.appendChild(item);
  input.value = "";
}

function removeTask(button) {
  button.parentElement.remove();
}
</script>

</body>
</html>
