<!DOCTYPE html>
<html>
<head>
  <title>ClassClassroom</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
    }

    header {
      background: #2d6cdf;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      color: #2d6cdf;
    }

    button {
      margin-top: 10px;
      padding: 6px 10px;
      border: none;
      background: #2d6cdf;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1b4fa8;
    }

    ul li {
      margin: 6px 0;
    }
  </style>
</head>

<body>

<header>ClassClassroom</header>

<div class="container">

  <div class="card">
    <h2>Announcements</h2>
    <p>Welcome to the class website.</p>
  </div>

  <div class="card">
    <h2>Assignments</h2>

    <ul id="taskList">
      <li>
        Math homework
        <button onclick="removeTask(this)">Remove</button>
      </li>

      <li>
        Reading task
        <button onclick="removeTask(this)">Remove</button>
      </li>
    </ul>

    <button onclick="addTask()">Add new task</button>
  </div>

  <div class="card">
    <h2>Resources</h2>
    <ul>
      <li>Notes</li>
      <li>Videos</li>
    </ul>
  </div>

</div>

<script>
function addTask() {
  const list = document.getElementById("taskList");

  const item = document.createElement("li");
  item.innerHTML = `
    New assignment
    <button onclick="removeTask(this)">Remove</button>
  `;

  list.appendChild(item);
}

function removeTask(button) {
  button.parentElement.remove();
}
</script>

</body>
</html>
